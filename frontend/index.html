<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #03060f;
      font-family: system-ui, -apple-system, sans-serif;
      color: #cbd5e1;
      overflow: hidden;
      gap: 2.5rem;
    }

    /* ─── Orb ─────────────────────────────────── */
    .orb-scene {
      position: relative;
      width: 240px;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid transparent;
      transition: border-color 0.6s ease, transform 0.6s ease;
    }
    .ring-1 { width: 290px; height: 290px; }
    .ring-2 { width: 340px; height: 340px; }
    .ring-3 { width: 390px; height: 390px; }

    .orb {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 38% 32%,
          #bfdbfe 0%,
          #3b82f6 28%,
          #1d4ed8 55%,
          #1e3a8a 75%,
          #0a1628 100%
        );
      box-shadow: inset 0 0 60px #0a1628;
      transition: box-shadow 0.5s ease;
      position: relative;
      z-index: 10;
    }

    /* Specular glint */
    .orb::before {
      content: '';
      position: absolute;
      top: 13%;
      left: 20%;
      width: 34%;
      height: 26%;
      background: radial-gradient(circle, rgba(255,255,255,0.38) 0%, transparent 70%);
      border-radius: 50%;
    }

    /* ── State: listening ── */
    .listening .orb {
      box-shadow:
        0 0 28px #3b82f6,
        0 0 60px rgba(59,130,246,.55),
        0 0 110px rgba(59,130,246,.25),
        inset 0 0 50px #1e3a8a;
      animation: breathe 2.6s ease-in-out infinite;
    }
    .listening .ring-1 {
      border-color: rgba(59,130,246,.30);
      animation: ring-out 2.6s ease-in-out infinite;
    }
    .listening .ring-2 {
      border-color: rgba(59,130,246,.18);
      animation: ring-out 2.6s ease-in-out infinite 0.35s;
    }
    .listening .ring-3 {
      border-color: rgba(59,130,246,.08);
      animation: ring-out 2.6s ease-in-out infinite 0.7s;
    }

    /* ── State: thinking ── */
    .thinking .orb {
      background:
        radial-gradient(circle at 38% 32%,
          #e0e7ff 0%,
          #818cf8 28%,
          #4f46e5 55%,
          #312e81 75%,
          #0a0818 100%
        );
      box-shadow:
        0 0 28px #818cf8,
        0 0 70px rgba(129,140,248,.5),
        inset 0 0 50px #312e81;
      animation: spin-shimmer 1.8s linear infinite;
    }
    .thinking .ring-1 {
      border-color: rgba(129,140,248,.35);
      animation: ring-spin 3s linear infinite;
    }
    .thinking .ring-2 {
      border-color: rgba(129,140,248,.20);
      animation: ring-spin 5s linear infinite reverse;
    }

    /* ── State: speaking ── */
    .speaking .orb {
      box-shadow:
        0 0 40px #60a5fa,
        0 0 90px rgba(96,165,250,.65),
        0 0 160px rgba(59,130,246,.3),
        inset 0 0 50px #1d4ed8;
      animation: speak-pulse 0.9s ease-in-out infinite;
    }
    .speaking .ring-1 {
      border-color: rgba(96,165,250,.45);
      animation: ring-out 0.9s ease-in-out infinite;
    }
    .speaking .ring-2 {
      border-color: rgba(96,165,250,.25);
      animation: ring-out 0.9s ease-in-out infinite 0.2s;
    }
    .speaking .ring-3 {
      border-color: rgba(96,165,250,.12);
      animation: ring-out 0.9s ease-in-out infinite 0.4s;
    }

    @keyframes breathe {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.045); }
    }
    @keyframes speak-pulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.075); }
    }
    @keyframes spin-shimmer {
      0% { filter: hue-rotate(0deg); transform: scale(1); }
      50% { transform: scale(1.06); }
      100% { filter: hue-rotate(25deg); transform: scale(1); }
    }
    @keyframes ring-out {
      0%,100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.12); opacity: 0.5; }
    }
    @keyframes ring-spin {
      to { transform: rotate(360deg); }
    }

    /* ─── Text area ────────────────────────────── */
    .info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.55rem;
      max-width: 420px;
      text-align: center;
      min-height: 5rem;
    }

    .status-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #334155;
      transition: color 0.4s;
    }
    .listening  .status-label { color: #3b82f6; }
    .thinking   .status-label { color: #818cf8; }
    .speaking   .status-label { color: #34d399; }

    .user-text {
      font-size: 0.92rem;
      color: #64748b;
      font-style: italic;
      min-height: 1.3em;
    }

    .live-text {
      font-size: 0.92rem;
      color: #93c5fd;
      min-height: 1.3em;
    }
    .live-text::after {
      content: '▋';
      display: inline-block;
      animation: blink 0.9s step-end infinite;
      margin-left: 2px;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    .agent-text {
      font-size: 0.97rem;
      color: #e2e8f0;
      line-height: 1.65;
      min-height: 1.3em;
    }

    /* ─── Button ───────────────────────────────── */
    .btn {
      padding: 0.7rem 2.6rem;
      border-radius: 9999px;
      border: 1px solid rgba(59,130,246,.35);
      background: rgba(59,130,246,.08);
      color: #60a5fa;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s, color 0.2s;
    }
    .btn:hover {
      background: rgba(59,130,246,.18);
      border-color: rgba(59,130,246,.7);
      box-shadow: 0 0 22px rgba(59,130,246,.3);
    }

    /* ─── Floating particles ───────────────────── */
    #particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    .pt {
      position: absolute;
      border-radius: 50%;
      background: #3b82f6;
    }
  </style>
</head>
<body>

<div class="orb-scene" id="scene">
  <div class="ring ring-3" id="r3"></div>
  <div class="ring ring-2" id="r2"></div>
  <div class="ring ring-1" id="r1"></div>
  <div class="orb"         id="orb"></div>
</div>

<div class="info" id="info">
  <div class="status-label" id="statusLabel">Ready</div>
  <div class="live-text"    id="liveText"  style="display:none"></div>
  <div class="user-text"    id="userText"></div>
  <div class="agent-text"   id="agentText"></div>
</div>

<button class="btn" id="btn" onclick="toggle()">Start</button>

<canvas id="particles"></canvas>

<script>
// AudioWorklet processor — captures 16kHz mono PCM (80ms chunks → 1280 samples)
const _PCM_PROCESSOR = `
class PCMProcessor extends AudioWorkletProcessor {
  constructor() { super(); this._buf = []; }
  process(inputs) {
    const ch = inputs[0]?.[0];
    if (ch) for (let s of ch) this._buf.push(s);
    while (this._buf.length >= 1280) {
      this.port.postMessage(new Float32Array(this._buf.splice(0, 1280)));
    }
    return true;
  }
}
registerProcessor('pcm-proc', PCMProcessor);
`;

// ─── State ────────────────────────────────────────────────
let ws          = null;
let micStream   = null;
let audioCtx    = null;
let audioNode   = null;
let active      = false;
let currentState = 'idle';

// ─── Audio playback (MediaSource for streaming MP3) ───────
let msEl  = null;
let msSrc = null;
let msSb  = null;
const msQ  = [];
let msEndPending = false;

function resetAudio() {
  msEndPending = false;
  msQ.length = 0;
  if (msSrc && msSrc.readyState === 'open') {
    try { msSrc.endOfStream(); } catch {}
  }
  if (msEl) { msEl.pause(); msEl.src = ''; }

  msEl  = new Audio();
  msSrc = new MediaSource();
  msSb  = null;
  msEl.src = URL.createObjectURL(msSrc);

  msSrc.addEventListener('sourceopen', () => {
    msSb = msSrc.addSourceBuffer('audio/mpeg');
    msSb.addEventListener('updateend', flushMsQ);
    flushMsQ();
  }, { once: true });

  msEl.play().catch(() => {});
}

function flushMsQ() {
  if (!msSb || msSb.updating) return;
  if (msQ.length > 0) {
    msSb.appendBuffer(msQ.shift());
  } else if (msEndPending && msSrc.readyState === 'open') {
    try { msSrc.endOfStream(); } catch {}
    msEndPending = false;
  }
}

function addAudio(buf) {
  if (!msSb) { msQ.push(buf); return; }
  if (msSb.updating) { msQ.push(buf); return; }
  try { msSb.appendBuffer(buf); }
  catch { msQ.push(buf); }
}

function endAudio() {
  msEndPending = true;
  flushMsQ();
}

// ─── Orb state ────────────────────────────────────────────
function setState(s) {
  currentState = s;
  const scene = document.getElementById('scene');
  const label = document.getElementById('statusLabel');
  scene.className = 'orb-scene';
  label.className = 'status-label';
  if (s !== 'idle') {
    scene.classList.add(s);
    label.classList.add(s);
  }
  label.textContent = { idle: 'Ready', listening: 'Listening…', thinking: 'Thinking…', speaking: 'Speaking…' }[s] ?? s;
}

// ─── Session ──────────────────────────────────────────────
async function toggle() {
  active ? disconnect() : await start();
}

async function start() {
  if (!navigator.mediaDevices?.getUserMedia) {
    alert(
      'Microphone API unavailable.\n\n' +
      'Browsers only allow microphone access on secure origins.\n' +
      'Open the app via  http://localhost:8000  (not an IP address),\n' +
      'or serve it over HTTPS.'
    );
    return;
  }
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  } catch (e) {
    alert('Microphone access denied: ' + e.message);
    return;
  }

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.binaryType = 'arraybuffer';

  ws.onopen = async () => {
    active = true;
    document.getElementById('btn').textContent = 'Disconnect';
    setState('listening');

    // Capture raw 16kHz mono PCM for Deepgram Flux (linear16)
    audioCtx = new AudioContext({ sampleRate: 16000 });
    const blobUrl = URL.createObjectURL(new Blob([_PCM_PROCESSOR], { type: 'application/javascript' }));
    await audioCtx.audioWorklet.addModule(blobUrl);
    URL.revokeObjectURL(blobUrl);

    const source = audioCtx.createMediaStreamSource(micStream);
    audioNode = new AudioWorkletNode(audioCtx, 'pcm-proc');

    let chunksSent = 0;
    audioNode.port.onmessage = e => {
      if (ws?.readyState !== WebSocket.OPEN) return;
      const f32 = e.data;
      const i16 = new Int16Array(f32.length);
      for (let i = 0; i < f32.length; i++)
        i16[i] = Math.max(-32768, Math.min(32767, Math.round(f32[i] * 32767)));
      ws.send(i16.buffer);
      chunksSent++;
      if (chunksSent === 1 || chunksSent % 25 === 0)
        console.log(`[voice-agent] PCM chunks sent: ${chunksSent}  bytes=${i16.byteLength}`);
    };

    source.connect(audioNode);
  };

  ws.onmessage = e => {
    if (e.data instanceof ArrayBuffer) {
      addAudio(e.data);
      return;
    }
    const msg = JSON.parse(e.data);
    const live = document.getElementById('liveText');
    const user = document.getElementById('userText');
    const agent = document.getElementById('agentText');
    switch (msg.type) {
      case 'state':
        setState(msg.state);
        if (msg.state === 'speaking') {
          resetAudio();
          live.style.display = 'none';
          live.textContent = '';
        }
        if (msg.state === 'listening') {
          live.style.display = '';
        }
        break;
      case 'live_transcript':
        live.style.display = '';
        live.textContent = msg.text;
        break;
      case 'transcript':
        live.style.display = 'none';
        live.textContent = '';
        user.textContent  = '”' + msg.text + '”';
        agent.textContent = '';
        break;
      case 'response_text':
        agent.textContent += msg.text;
        break;
      case 'audio_done':
        endAudio();
        break;
    }
  };

  ws.onerror = err => console.error('ws error', err);
  ws.onclose = () => cleanup();
}

function disconnect() {
  ws?.close();
}

function cleanup() {
  active = false;
  audioNode?.disconnect();
  audioCtx?.close();
  audioNode = null;
  audioCtx  = null;
  micStream?.getTracks().forEach(t => t.stop());
  micStream = null;
  setState('idle');
  document.getElementById('btn').textContent = 'Start';
}


// ─── Particles ────────────────────────────────────────────
const canvas = document.getElementById('particles');
const ctx2   = canvas.getContext('2d');
const pts    = [];

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

function spawnPt() {
  if (!active) return;
  const cx = window.innerWidth  / 2;
  const cy = window.innerHeight / 2;
  const angle  = Math.random() * Math.PI * 2;
  const radius = 80 + Math.random() * 30;
  pts.push({
    x:  cx + Math.cos(angle) * radius,
    y:  cy + Math.sin(angle) * radius,
    vx: (Math.random() - 0.5) * 1.2,
    vy: -0.6 - Math.random() * 1.2,
    r:  1 + Math.random() * 1.5,
    life: 1,
    decay: 0.008 + Math.random() * 0.012,
    hue: currentState === 'thinking' ? 240 : currentState === 'speaking' ? 210 : 220,
  });
}

function drawPts() {
  ctx2.clearRect(0, 0, canvas.width, canvas.height);
  for (let i = pts.length - 1; i >= 0; i--) {
    const p = pts[i];
    p.x += p.vx; p.y += p.vy; p.life -= p.decay;
    if (p.life <= 0) { pts.splice(i, 1); continue; }
    ctx2.beginPath();
    ctx2.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx2.fillStyle = `hsla(${p.hue},90%,70%,${p.life * 0.7})`;
    ctx2.fill();
  }
  requestAnimationFrame(drawPts);
}
drawPts();
setInterval(spawnPt, 180);
</script>
</body>
</html>
